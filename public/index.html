<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Big Jim's Golf Sim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <head>
      <link rel="icon" href="logomebe6.svg" />
    </head>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="main">
      <div class="hero">
        <div class="logo-box">
          <img class="logo" src="logomebe6.svg" />
        </div>
        <h1>
          Big Jim's <br /><span style="font-weight: lighter">Golf Sim</span>
        </h1>
      </div>
      <iframe
        data-tally-src="https://tally.so/embed/xXkeNk?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
        loading="lazy"
        width="100%"
        height="100vh""
        frameborder="0"
        marginheight="0"
        marginwidth="0"
        title="Big Jim's Golf Sim (Camberwell) - Pre-registration."
      ></iframe>
      <script>
        var d = document,
          w = "https://tally.so/widgets/embed.js",
          v = function () {
            "undefined" != typeof Tally
              ? Tally.loadEmbeds()
              : d
                  .querySelectorAll("iframe[data-tally-src]:not([src])")
                  .forEach(function (e) {
                    e.src = e.dataset.tallySrc;
                  });
          };
        if ("undefined" != typeof Tally) v();
        else if (d.querySelector('script[src="' + w + '"]') == null) {
          var s = d.createElement("script");
          ((s.src = w), (s.onload = v), (s.onerror = v), d.body.appendChild(s));
        }
      </script>
    </main>
  </body>
</html>
